[package]
name = "karaoketyper"
version = "0.1.0"
description = "Offline cross-platform voice dictation with push-to-talk"
authors = ["KaraokeTyper Team"]
edition = "2021"

[lib]
name = "karaoketyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for model downloads (using rustls to avoid OpenSSL system dependency)
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures = "0.3"

# Low-level system calls
libc = "0.2"

# Cross-platform paths
dirs = "5.0"

# Audio capture (cross-platform: WASAPI/CoreAudio/ALSA)
cpal = "0.15"
hound = "3.5"

# Zip archive for GNOME extension packaging
zip = "2.2"

# Lock-free ring buffer for zero-latency audio capture
ringbuf = "0.4"

# Error handling
thiserror = "2.0"

# Clipboard (cross-platform: Windows/macOS/Linux+Wayland)
arboard = "3.4"

# Keyboard simulation (cross-platform)
enigo = "0.2"

# Keyboard event listening (cross-platform)
rdev = "0.5"

# Linux-specific dependencies (conditional)
[target.'cfg(target_os = "linux")'.dependencies]
# evdev for low-level keyboard access on Wayland (fallback)
evdev = "0.12"

[features]
default = []
