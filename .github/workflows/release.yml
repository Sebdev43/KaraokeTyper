name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `KaraokeTyper v${version}`,
              body: `## What's New in v${version}

            ### On-demand microphone
            - **Mic opens only during PTT** — no more permanent mic indicator in system tray
            - Stream opens on press, closes on release (device fully released)

            ### Cleaner terminal output
            - **Suppressed whisper.cpp verbose logs** (beam search flood eliminated)
            - Only KaraokeTyper's own logs are shown

            ### Ghostty & terminal paste fix
            - **Ghostty terminal detected** via reverse-domain WM_CLASS (com.mitchellh.ghostty)
            - Terminal detection moved to Rust side for reliability (no stale GNOME extension cache)
            - Correct Ctrl+Shift+V paste in all terminals

            ---

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | **Linux** | \`karaoketyper_${version}_amd64.deb\` | Debian/Ubuntu package |
            | **Linux** | \`karaoketyper_${version}_amd64.AppImage\` | Portable AppImage |
            | **Windows** | \`karaoketyper_${version}_x64-setup.exe\` | Windows installer |
            | **Windows** | \`karaoketyper_${version}_x64_en-US.msi\` | Windows MSI package |
            | **macOS** | \`karaoketyper_${version}_aarch64.dmg\` | macOS Apple Silicon DMG |

            ### Installation

            **Linux (Debian/Ubuntu):**
            \`\`\`bash
            sudo dpkg -i karaoketyper_${version}_amd64.deb
            sudo apt-get install -f
            \`\`\`

            **Linux (AppImage):**
            \`\`\`bash
            chmod +x karaoketyper_${version}_amd64.AppImage
            ./karaoketyper_${version}_amd64.AppImage
            \`\`\`

            **Windows:** Run the installer (.exe or .msi)

            **macOS:** Mount the DMG and drag to Applications

            ---
            *100% offline voice dictation - no cloud, no telemetry*
            `,
              draft: true,
              prerelease: false
            });
            return data.id;

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libunwind-dev

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.3.290.0"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          $installerPath = "$env:TEMP\VulkanSDK-$version-Installer.exe"

          Write-Host "Downloading Vulkan SDK $version..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

          # Set environment variables
          $sdkPath = "C:\VulkanSDK\$version"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-macos:
    needs: create-release
    # Note: Intel (x86_64) build disabled - macos-13 runner unavailable
    # Most modern Macs use Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        run: |
          brew install cmake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          CFLAGS: '-mmacosx-version-min=10.15'
          CXXFLAGS: '-mmacosx-version-min=10.15'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-metal

  publish-release:
    needs: [create-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            });
