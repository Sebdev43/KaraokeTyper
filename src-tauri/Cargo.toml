[package]
name = "karaoketyper"
version = "1.9.0"
description = "Offline cross-platform voice dictation with push-to-talk"
authors = ["KaraokeTyper Team"]
edition = "2021"
license = "MIT"

[lib]
name = "karaoketyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.10", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-process = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.4"
# Auto-updater (AppImage, MSI, EXE, DMG — .deb handled by custom pkexec path)
tauri-plugin-updater = "2.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Type-safe Tauri commands with auto-generated TypeScript bindings
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }
# CancellationToken, so a multi-GB model download can be stopped without waiting
# for it to finish. Already in the tree via tokio's ecosystem.
tokio-util = "0.7"

# HTTP client for model downloads (using rustls to avoid OpenSSL system dependency)
reqwest = { version = "0.13", features = ["stream", "rustls"], default-features = false }
futures = "0.3"

# Low-level system calls
libc = "0.2"

# Cross-platform paths
dirs = "7"

# Audio capture - hound for WAV encoding
hound = "3.5"

# Zip archive for GNOME extension packaging
zip = "9"

# SHA-256 for verifying model bundle integrity during download.
sha2 = "0.11"
hex = "0.4"

# Tar + gzip for extracting ONNX model bundles (kept for future engines that
# actually ship as .tar.gz; Parakeet V3 is fetched as individual files with
# per-file SHA-256 verification instead).
tar = "0.4"
flate2 = "1"

# Clipboard (cross-platform: Windows/macOS/Linux+Wayland)
tauri-plugin-clipboard-manager = "2.3"

# Keyboard simulation (cross-platform)
enigo = "0.6"

# Keyboard event listening (cross-platform)
rdev = "0.5"

# Speech-to-text, two libraries with one job each.
#
# transcribe-cpp (GGUF/ggml) runs the Whisper family. Chosen over whisper-rs for the
# decode knobs it exposes — temperature fallback above all, which neither
# transcribe-rs nor whisper-rs surfaces, and whose absence shows up as replaced
# words on long dictations. Its GPU backend follows the `gpu-*` features below.
transcribe-cpp = { version = "0.3.1", default-features = false }
#
# transcribe-rs keeps the ONNX engines (Parakeet; Canary/Cohere available). Reduced
# to `onnx`: linking two ggml builds (whisper-rs's and transcribe-cpp's) is not
# possible. Pinned: 0.3.x is declared unstable upstream until 0.5.
#
# Voice Activity Detection (Silero VAD v4) uses ort directly (vad.rs). Only one ort
# can be linked (`links = "onnxruntime"`), so its version is dictated by transcribe-rs
# (0.3.11 requires exactly rc.12). `download-binaries` needs a TLS feature since
# rc.11; rustls keeps OpenSSL out of the build.
transcribe-rs = { version = "=0.3.11", default-features = false, features = ["onnx"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }

# Audio playback for feedback sounds
rodio = "0.20"

# Audio capture (cross-platform: ALSA on Linux via pipewire-alsa, CoreAudio on macOS, WASAPI on Windows)
cpal = "0.15"
# Wait-free SPSC ring between the cpal callback and the audio worker (no allocation
# on the audio thread)
rtrb = "0.4"

# Anti-aliased sample-rate conversion for devices that can't give us 16kHz directly.
# Kept on 0.16 for its FftFixedIn API: 1.0 renamed it to Fft + FixedSync::Input and
# moved buffers to audioadapter (resampler.rs rewrite, planned with the cpal 0.18 lot).
rubato = "0.16"

# Optional: Ollama LLM client for text correction. `rustls` instead of its
# default native-tls, so the `ollama` feature does not pull OpenSSL into the binary.
ollama-rs = { version = "0.3", default-features = false, features = ["rustls", "stream"], optional = true }

# String similarity for custom word matching (Levenshtein distance)
strsim = "0.11"

# Typed errors for the STT dispatcher
thiserror = "2"

# evdev for low-level keyboard access on Wayland (fallback)
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

# jemalloc - reduces virtual memory fragmentation with many threads (Linux/macOS)
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"
# Raw mallctl access, so memory.rs can purge jemalloc's arenas after a dictation.
# tikv-jemallocator installs the allocator but exposes no control interface.
tikv-jemalloc-sys = "0.7.1"

# `significant_drop_in_scrutinee` is what catches a `MutexGuard` built inside a
# `match` scrutinee: it lives until the end of the `match`, so an arm that takes
# the same lock deadlocks against itself. Both lints are nursery, hence opt-in.
[lints.clippy]
significant_drop_in_scrutinee = "warn"

[features]
default = []
# GPU acceleration for Whisper (requires the SDK at compile time). tauri.conf.json
# and the release workflow pass one of them; a plain `cargo build` is CPU-only and
# `use_gpu` defaults accordingly (config.rs).
# Linux/Windows: cargo build --features gpu-vulkan
# macOS: cargo build --features gpu-metal
gpu-vulkan = ["transcribe-cpp/vulkan"]
gpu-metal = ["transcribe-cpp/metal"]
# Ollama integration for post-transcription text correction
ollama = ["dep:ollama-rs"]
