name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          # Extract the section between `## [VERSION]` and the next `## [` heading.
          # Falls back to a neutral placeholder if the section is missing so the
          # release body stays readable.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes-section.md

          if [ ! -s /tmp/release-notes-section.md ]; then
            printf "_Pas de notes spécifiques — voir le [CHANGELOG](https://github.com/%s/blob/dev/CHANGELOG.md)._\n" \
              "$GITHUB_REPOSITORY" > /tmp/release-notes-section.md
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelogSection = fs
              .readFileSync('/tmp/release-notes-section.md', 'utf8')
              .trim();

            const body = [
              `## KaraokeTyper v${version}`,
              '',
              '### ✨ Nouveautés',
              '',
              changelogSection,
              '',
              `Voir le [CHANGELOG complet](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/dev/CHANGELOG.md) pour l'historique entier.`,
              '',
              '---',
              '',
              '### Téléchargements',
              '',
              '| Plateforme | Fichier | Description |',
              '|------------|---------|-------------|',
              `| **Linux** | \`karaoketyper_${version}_amd64.deb\` | Paquet Debian/Ubuntu |`,
              `| **Linux** | \`karaoketyper_${version}_amd64.AppImage\` | AppImage portable |`,
              `| **Windows** | \`karaoketyper_${version}_x64-setup.exe\` | Installateur Windows |`,
              `| **Windows** | \`karaoketyper_${version}_x64_en-US.msi\` | Paquet MSI Windows |`,
              `| **macOS** | \`karaoketyper_${version}_aarch64.dmg\` | DMG macOS Apple Silicon |`,
              '',
              '### Installation',
              '',
              '**Linux (Debian/Ubuntu) :**',
              '```bash',
              `sudo dpkg -i karaoketyper_${version}_amd64.deb`,
              'sudo apt-get install -f',
              '```',
              '',
              '**Linux (AppImage) :**',
              '```bash',
              `chmod +x karaoketyper_${version}_amd64.AppImage`,
              `./karaoketyper_${version}_amd64.AppImage`,
              '```',
              '',
              '**Windows :** Lancez l\'installateur (.exe ou .msi)',
              '',
              '**macOS :** Montez le DMG et glissez dans Applications',
              '',
              '> **À partir de v1.4.0**, les mises à jour ultérieures se font directement depuis l\'application : Paramètres → À propos → Rechercher.',
              '',
              '---',
              '*Dictée vocale 100% hors-ligne — pas de cloud, pas de télémétrie*',
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `KaraokeTyper v${version}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libunwind-dev

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The version is resolved at build time instead of being pinned, because a
      # pin does not survive on this channel: LunarG deletes the installer of an
      # older SDK from sdk.lunarg.com, and the 1.3.290.0 this step used to name
      # started returning 404 between the 1.8.0 and 1.9.0 releases, failing the
      # job on a URL that had worked for months. The SDK only supplies the
      # headers, the loader and glslc for building ggml's Vulkan backend, and a
      # newer SDK builds an older application, so following the current version
      # is the behaviour that keeps working. The download is checked rather than
      # assumed: a 404 would otherwise hand a few bytes of HTML to the installer.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Unexpected Vulkan SDK version from LunarG: '$version'"
          }
          Write-Host "Vulkan SDK $version"

          # `vulkan_sdk.exe` rather than the installer's real file name. LunarG
          # renamed it from VulkanSDK-<version>-Installer.exe to
          # vulkansdk-windows-X64-<version>.exe, which broke this step a second
          # time; this alias sits under the same versioned path, so the version
          # stays pinned while the naming is theirs to change.
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          $installerPath = "$env:TEMP\VulkanSDK-$version-Installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          if ((Get-Item $installerPath).Length -lt 1MB) {
            throw "Vulkan SDK installer is too small to be real: $installerUrl"
          }

          Write-Host "Installing..."
          $p = Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }

          $sdkPath = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdkPath)) { throw "Vulkan SDK is not at $sdkPath after install" }

          # VULKAN_SDK and Bin are not enough to link: ggml asks rustc for
          # `vulkan-1.lib` without a search path, and the link failed on
          # `LNK1181: cannot open input file 'vulkan-1.lib'` the first time this
          # job got far enough to try. RUSTFLAGS adds the one directory that
          # holds it, which is narrower than rewriting LIB — that variable also
          # carries the MSVC and UCRT directories rustc relies on.
          $libPath = "$sdkPath\Lib"
          if (-not (Test-Path "$libPath\vulkan-1.lib")) {
            throw "vulkan-1.lib is not in $libPath — the SDK layout changed"
          }
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "RUSTFLAGS=-L native=$libPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # whisper.cpp 1.8's Vulkan shader generator is a nested CMake ExternalProject:
      # under the default target dir its scratch files exceed MSVC's 260-character
      # path limit ("C1083: Cannot open source file"). A short target dir keeps every
      # path well under it.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> D:\kt

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TARGET_DIR: D:\kt
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-macos:
    needs: create-release
    # Note: Intel (x86_64) build disabled - macos-13 runner unavailable
    # Most modern Macs use Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install macOS dependencies
        run: |
          brew install cmake

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # bundle_dmg.sh drives Finder through AppleScript to lay out the DMG window.
          # GitHub's macOS provisioner update (June 2025) made that call time out on the
          # runners — including macos-14, which this job already pins, so pinning is not
          # the answer. Skipping the cosmetic layout step lets the DMG build; it loses
          # the custom icon positions, not the installer.
          # tauri-apps/tauri-action#1003, #1091
          TAURI_BUNDLER_DMG_IGNORE_CI: false
          # 11.0, and set in one place only.
          #
          # ggml reaches for std::filesystem, which libc++ marks unavailable
          # below macOS 10.15, and the first 1.9.0 build failed on exactly that.
          # The cause was not the number but the number of places: CFLAGS and
          # CXXFLAGS appended `-mmacosx-version-min` after cc-rs had already put
          # its own default on the command line, leaving two contradictory values
          # per compile and the lower one in effect. MACOSX_DEPLOYMENT_TARGET is
          # the single variable cc-rs, cmake and clang all read, so it is the
          # only one set here.
          #
          # 11.0 rather than 10.15 because this job builds for Apple Silicon only
          # (the Intel runner was dropped above): 11.0 is the first macOS that
          # runs on that hardware, so a lower target describes a machine that
          # could never install the result.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # The deployment target above governs the link and the bundle, but it
          # does not reach ggml's compile: cc-rs puts `-mmacosx-version-min=10.13`
          # on the CMake flags whatever this variable says — measured twice, in the
          # 1.9.0 builds, where 11.0 appeared nowhere in the configure line. libc++
          # then refuses std::filesystem as unavailable before 10.15 and the build
          # stops.
          #
          # _LIBCPP_DISABLE_AVAILABILITY is libc++'s own switch for this, and it is
          # sound rather than a silencer: the published bundle is Apple Silicon
          # only, so the oldest machine that can install it runs macOS 11, where
          # std::filesystem has existed since the previous release. The check is
          # what is wrong here, not the code it rejects.
          CXXFLAGS: '-D_LIBCPP_DISABLE_AVAILABILITY'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config src-tauri/tauri.macos.conf.json --features gpu-metal

  generate-updater-manifest:
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    needs: [create-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/generate-latest-json.sh > latest.json
          cat latest.json
          gh release upload "v${VERSION}" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # Every platform, not any of them. The first 1.9.0 tag published itself with
  # Linux binaries alone: this job's condition accepted a single success, so the
  # Windows and macOS failures did not stop it. What went out was a release
  # announcing a version that two thirds of its users could not install — the
  # manifest itself was honest, since generate-latest-json.sh only lists a
  # platform whose bundle and signature both exist. A partial release is a
  # deliberate act, not the default when a build breaks, so a failed platform now
  # leaves the release as the draft create-release made, to publish by hand or
  # rebuild from a new tag.
  publish-release:
    needs: [create-release, build-linux, build-windows, build-macos, generate-updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            });
