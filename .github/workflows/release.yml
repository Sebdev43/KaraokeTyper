name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          # Extract the section between `## [VERSION]` and the next `## [` heading.
          # Falls back to a neutral placeholder if the section is missing so the
          # release body stays readable.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/release-notes-section.md

          if [ ! -s /tmp/release-notes-section.md ]; then
            printf "_Pas de notes spécifiques — voir le [CHANGELOG](https://github.com/%s/blob/dev/CHANGELOG.md)._\n" \
              "$GITHUB_REPOSITORY" > /tmp/release-notes-section.md
          fi

      - name: Create Release
        id: create-release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.VERSION;
            const changelogSection = fs
              .readFileSync('/tmp/release-notes-section.md', 'utf8')
              .trim();

            const body = [
              `## KaraokeTyper v${version}`,
              '',
              '### ✨ Nouveautés',
              '',
              changelogSection,
              '',
              `Voir le [CHANGELOG complet](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/dev/CHANGELOG.md) pour l'historique entier.`,
              '',
              '---',
              '',
              '### Téléchargements',
              '',
              '| Plateforme | Fichier | Description |',
              '|------------|---------|-------------|',
              `| **Linux** | \`karaoketyper_${version}_amd64.deb\` | Paquet Debian/Ubuntu |`,
              `| **Linux** | \`karaoketyper_${version}_amd64.AppImage\` | AppImage portable |`,
              `| **Windows** | \`karaoketyper_${version}_x64-setup.exe\` | Installateur Windows |`,
              `| **Windows** | \`karaoketyper_${version}_x64_en-US.msi\` | Paquet MSI Windows |`,
              `| **macOS** | \`karaoketyper_${version}_aarch64.dmg\` | DMG macOS Apple Silicon |`,
              '',
              '### Installation',
              '',
              '**Linux (Debian/Ubuntu) :**',
              '```bash',
              `sudo dpkg -i karaoketyper_${version}_amd64.deb`,
              'sudo apt-get install -f',
              '```',
              '',
              '**Linux (AppImage) :**',
              '```bash',
              `chmod +x karaoketyper_${version}_amd64.AppImage`,
              `./karaoketyper_${version}_amd64.AppImage`,
              '```',
              '',
              '**Windows :** Lancez l\'installateur (.exe ou .msi)',
              '',
              '**macOS :** Montez le DMG et glissez dans Applications',
              '',
              '> **À partir de v1.4.0**, les mises à jour ultérieures se font directement depuis l\'application : Paramètres → À propos → Rechercher.',
              '',
              '---',
              '*Dictée vocale 100% hors-ligne — pas de cloud, pas de télémétrie*',
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `KaraokeTyper v${version}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libunwind-dev

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.3.290.0"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          $installerPath = "$env:TEMP\VulkanSDK-$version-Installer.exe"

          Write-Host "Downloading Vulkan SDK $version..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

          # Set environment variables
          $sdkPath = "C:\VulkanSDK\$version"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --features gpu-vulkan

  build-macos:
    needs: create-release
    # Note: Intel (x86_64) build disabled - macos-13 runner unavailable
    # Most modern Macs use Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install macOS dependencies
        run: |
          brew install cmake

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
          CFLAGS: '-mmacosx-version-min=10.15'
          CXXFLAGS: '-mmacosx-version-min=10.15'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config src-tauri/tauri.macos.conf.json --features gpu-metal

  generate-updater-manifest:
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    needs: [create-release, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/generate-latest-json.sh > latest.json
          cat latest.json
          gh release upload "v${VERSION}" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    if: always() && needs.create-release.result == 'success' && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    needs: [create-release, build-linux, build-windows, build-macos, generate-updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            });
