[package]
name = "karaoketyper"
version = "1.3.0"
description = "Offline cross-platform voice dictation with push-to-talk"
authors = ["KaraokeTyper Team"]
edition = "2021"

[lib]
name = "karaoketyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Type-safe Tauri commands with auto-generated TypeScript bindings
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for model downloads (using rustls to avoid OpenSSL system dependency)
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures = "0.3"

# Low-level system calls
libc = "0.2"

# Cross-platform paths
dirs = "5.0"

# Audio capture - hound for WAV encoding
hound = "3.5"

# Zip archive for GNOME extension packaging
# default-features off to avoid pulling lzma-sys, which conflicts with voxtral's liblzma-sys.
# We only need deflate compression for GNOME extension packaging.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Lock-free ring buffer for zero-latency audio capture
ringbuf = "0.4"

# Clipboard (cross-platform: Windows/macOS/Linux+Wayland)
tauri-plugin-clipboard-manager = "2"

# Keyboard simulation (cross-platform)
enigo = "0.6"

# Keyboard event listening (cross-platform)
rdev = "0.5"

# Speech-to-text — unified multi-backend engine (Whisper + ONNX engines)
# Whisper feature kept active; ONNX engines added in lot 4.
transcribe-rs = { version = "=0.2.8", features = ["whisper"] }

# Voice Activity Detection (Silero VAD v4) — direct ort usage
# vad-rs crates.io pins ort rc.9 which doesn't compile on Rust 1.92+
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }

# Audio playback for feedback sounds
rodio = "0.20"

# Audio capture (cross-platform: ALSA on Linux via pipewire-alsa, CoreAudio on macOS, WASAPI on Windows)
cpal = "0.15"

# Optional: Ollama LLM client for text correction
ollama-rs = { version = "0.2", features = ["stream"], optional = true }

# String similarity for custom word matching (Levenshtein distance)
strsim = "0.11"

# Typed errors for the STT dispatcher
thiserror = "1"

# Voxtral local backend — opt-in via `--features voxtral`.
# Pulls Burn 0.20 + wgpu 26 transitively (~200 MB of deps, 8-12 min first build).
# Deliberately off by default to keep the standard build light.
voxtral-mini-realtime = { git = "https://github.com/TrevorS/voxtral-mini-realtime-rs", tag = "v0.2.5", optional = true, default-features = false, features = ["wgpu", "hub", "native-tokenizer"] }
# Burn is used directly to construct tensors for the Voxtral inference loop.
# Version + features must match what voxtral-mini-realtime pulls transitively.
burn = { version = "0.20", optional = true, default-features = false, features = ["std", "autodiff", "template", "autotune", "wgpu"] }

# evdev for low-level keyboard access on Wayland (fallback)
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

# jemalloc - reduces virtual memory fragmentation with many threads (Linux/macOS)
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = []
# GPU acceleration features (requires SDK installed for compilation)
# Linux/Windows: cargo build --features gpu-vulkan
# macOS: cargo build --features gpu-metal
# GPU acceleration — currently inert placeholders, wired back to transcribe-rs in a later lot.
gpu-vulkan = []
gpu-metal = []
# Voxtral local backend (Burn + wgpu). Opt-in — see crate docs.
voxtral = ["dep:voxtral-mini-realtime", "dep:burn"]
# Ollama integration for post-transcription text correction
ollama = ["dep:ollama-rs"]
