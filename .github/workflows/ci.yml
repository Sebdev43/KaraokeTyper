name: CI

# Runs the checks this repository already had but never executed automatically:
# 165 Rust tests, clippy at -D warnings, rustfmt, the frontend build and Biome.
# `pr-check.yml` only looks for development-only files; `release.yml` builds the app
# but only on a tag, which is far too late to learn that a test broke.

on:
  # `dev` as much as `master`: CONTRIBUTING asks contributors to open their pull
  # request against `dev`, and both branches require these checks to pass. Left
  # to `master` alone, a pull request against `dev` reported no check at all and
  # branch protection could never be satisfied.
  pull_request:
    branches: [master, main, dev]
  push:
    branches: [master, main, dev]
  # Weekly, so upstream drift in the model catalogue is noticed even during a quiet
  # period — nobody opens a pull request to discover that HuggingFace re-uploaded a
  # model. Also catches dependency rot in the Rust job for free.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The debug build of whisper.cpp + ONNX Runtime plus the test binaries no longer
      # fit next to the runner's preinstalled toolchains ("No space left on device"
      # in `cargo test` since transcribe-rs 0.3). Dropping what this job never uses
      # frees ~25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h / | tail -1

      # Same list as release.yml's build-linux job, which is known to work — Tauri links
      # webkit2gtk, so even `cargo test` needs it — plus Vulkan.
      #
      # The Vulkan packages are for `--features gpu-vulkan` only, checked at the
      # end of this job: transcribe-cpp is taken with `default-features = false`,
      # so the plain `cargo test` below builds no GPU backend at all. ggml's Vulkan
      # backend needs the loader, the shader compiler *and* the SPIR-V headers;
      # release.yml pulls the full LunarG SDK, which bundles all three, but that
      # repository targets jammy and breaks on the noble runner ("held broken
      # packages"). Ubuntu's own packages cover it with no third-party repository.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libunwind-dev \
            libvulkan-dev \
            glslc \
            spirv-headers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Formatting first: it is the cheapest failure and needs no compilation.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      # --all-targets so test code is linted too — several findings in this project's
      # history were in tests.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # The feature every published build ships. Compiling it here is what keeps a
      # missing system package or a broken native build from being discovered at
      # tag time, when the release workflow is the first thing to try it.
      - name: cargo check --features gpu-vulkan
        working-directory: src-tauri
        run: cargo check --all-targets --features gpu-vulkan

  frontend:
    name: Frontend — build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # `npm run build` is the real gate: it type-checks and produces the bundle.
      # It relaxes noUnusedLocals, which is why `typecheck` below is separate.
      - name: npm run build
        run: npm run build

      - name: npm run lint
        run: npm run lint

  # Not blocking, and the reason is specific rather than a shrug: the only remaining
  # `tsc --noEmit` errors are two unused symbols (`TAURI_CHANNEL`, `__makeEvents__`) in
  # src/bindings.ts, which tauri-specta regenerates on every build. Editing them out is
  # pointless — the next build puts them back — and relaxing the flag globally is
  # exactly what `npm run build` already does. Kept visible so a *new* type error in
  # hand-written code is noticed, without a permanently red required check.
  typecheck:
    name: Frontend — strict typecheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # Separate and non-blocking on purpose: this one talks to huggingface.co, so a red
  # result may mean the network, not the pull request. Its value is the schedule — it
  # notices that an upstream model was re-uploaded, which silently invalidates every
  # SHA-256 the catalogue pins, before a user discovers it as a failed install.
  catalog:
    name: Model catalogue vs upstream (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: scripts/catalog.py check
        run: python3 scripts/catalog.py check
